services:
  backend:
    build:
      context: ./backend
    image: jerseyhub-backend:1.0
    env_file:
      - ./backend/.env
    expose:
      - "2987"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_RAZORPAY_ENABLED: "false"
    image: jerseyhub-frontend:1.0
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
