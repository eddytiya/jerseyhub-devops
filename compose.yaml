services:
  backend:
    build:
      context: ./backend
    image: jerseyhub-backend:1.0
    env_file:
      - ./backend/.env
    expose:
      - "2987"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_RAZORPAY_ENABLED: "false"
    image: jerseyhub-frontend:1.0
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
